<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sika AI — Ghana Financial Assistant</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --bubble: #334155;
    --accent: #fbbf24;
    --text: #f8fafc;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #334155;
    background: var(--panel);
  }
  header .logo {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--accent);
    color: #0f172a;
    font-weight: 800;
    display: grid; place-items: center;
  }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 0; font-size: 13px; color: var(--muted); }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #0f172a;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--bubble);
    border-bottom-left-radius: 4px;
  }
  .msg.assistant p { margin: 0 0 8px; }
  .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.error { align-self: flex-start; background: #7f1d1d; }
  .typing {
    align-self: flex-start;
    color: var(--muted);
    font-size: 14px;
    padding: 12px 16px;
  }
  form {
    border-top: 1px solid #334155;
    background: var(--panel);
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }
  input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 24px;
    border: 1px solid #475569;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    padding: 12px 20px;
    border: none;
    border-radius: 24px;
    background: var(--accent);
    color: #0f172a;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  footer {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding: 8px;
    background: var(--panel);
  }
  @media (max-width: 640px) {
    .msg { max-width: 92%; }
    form { flex-direction: column; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">GH</div>
  <div>
    <h1>Sika AI</h1>
    <p>Your Ghana financial assistant</p>
  </div>
</header>

<main id="chat" aria-live="polite"></main>

<form id="chat-form">
  <input id="input" type="text" placeholder="Ask me anything about finances in Ghana..." autocomplete="off" autofocus>
  <button type="submit">Send</button>
</form>

<footer>Sika AI is for informational purposes and is not a licensed financial advisor.</footer>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("input");
  const sendBtn = form.querySelector("button");
  let history = [];

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function renderMarkdown(text) {
    // Minimal markdown: paragraphs, bold, bullets. Falls back to raw text.
    let out = esc(text);
    out = out.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    out = out.replace(/^\s*[-*]\s+(.+)$/gm, "• $1");
    return out.split(/\n{2,}/).map(p => "<p>" + p.replace(/\n/g, "<br>") + "</p>").join("");
  }

  function addMessage(role, content) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.innerHTML = role === "assistant" ? renderMarkdown(content) : esc(content);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    sendBtn.disabled = true;
    addMessage("user", text);

    const typing = document.createElement("div");
    typing.className = "typing";
    typing.textContent = "Thinking...";
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_message: text, history }),
      });
      if (!res.ok) throw new Error((await res.json()).detail || "Request failed");
      const data = await res.json();
      history = data.history;
      typing.remove();
      addMessage("assistant", data.reply);
    } catch (e) {
      typing.remove();
      addMessage("error", "Error: " + e.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); send(); });
</script>
</body>
</html>
